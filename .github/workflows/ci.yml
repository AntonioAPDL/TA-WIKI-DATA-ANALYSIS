name: privacy-and-reproducibility-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: '4.5.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore locked R environment
        run: Rscript scripts/run.R bootstrap
        env:
          TA_WIKI_ALLOW_RENV_BOOTSTRAP: '1'
      - name: Enforce tracked-file privacy boundary
        run: Rscript scripts/run.R privacy --strict-history
      - name: Run adversarial privacy-scanner tests
        run: python tests/test_privacy_scan.py
      - name: Run private-handoff verifier tests
        run: python tests/test_private_handoff.py
      - name: Run synthetic and manifest-lineage tests
        run: Rscript scripts/run.R test
      - name: Verify final clean-clone baseline
        run: python scripts/verify_private_handoff.py . --strict-history
      - name: Ensure checks did not alter tracked files
        run: git diff --exit-code && test -z "$(git status --porcelain)"
